name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent/requirements*.lock
            backend/tests/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r agent/requirements-dev.lock -r agent/requirements-build.lock -r backend/tests/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e agent
          npm --prefix frontend ci --ignore-scripts
      - name: Agent tests
        run: python -m pytest agent/tests -q
      - name: Backend tests
        run: python -m pytest backend/tests/unit -q
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: Regenerate fictional samples
        run: |
          python frontend/demo/seed_demo_data.py
          git diff --exit-code -- frontend/demo samples agent/examples backend/lambda/*/test
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-${{ runner.os }}-${{ hashFiles('infrastructure/**/.terraform.lock.hcl') }}
      - name: Terraform format and offline-backend validation
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          # Runs terraform fmt -check -recursive, init -backend=false,
          # and terraform validate in isolated bootstrap/prod copies.
          python scripts/validate_terraform.py
