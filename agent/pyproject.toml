[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glorify-control-agent"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = ["APScheduler>=3.10,<4", "psutil>=5.9,<8", "httpx>=0.27,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3", "psycopg[binary]>=3.1,<4", "docker>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
glorify-control-agent = "glorify_control_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
